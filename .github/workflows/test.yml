name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Core module
        shell: bash
        run: GOWORK=off go test -race ./...

  official-profile-smoke:
    name: Released official profile smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve and build the default released profile
        shell: bash
        env:
          GOWORK: off
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ingot"
          ingot_home="$RUNNER_TEMP/ingot-home"
          project="$RUNNER_TEMP/ingot-project"

          go build -trimpath -o "$binary" ./cmd/ingot
          "$binary" --home "$ingot_home" setup --profile default
          "$binary" --home "$ingot_home" init "$project" --profile default
          "$binary" --home "$ingot_home" project resolve \
            --file "$project/plugins.toml" \
            --lock "$project/plugins.lock"
          "$binary" --home "$ingot_home" build smoke \
            --file "$project/plugins.toml" \
            --lock "$project/plugins.lock" \
            --tag local/ingot:released-profile-smoke
          "$binary" --home "$ingot_home" runtime show smoke --json >/dev/null
