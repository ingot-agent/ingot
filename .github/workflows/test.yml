name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test Core module
        shell: bash
        run: GOWORK=off go test -race ./...

  update-platforms:
    name: Core update tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test core distribution packages
        shell: bash
        run: GOWORK=off go test ./internal/buildinfo ./internal/release ./internal/coreupdate

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'install.ps1 contains parser errors'
          }

  official-profile-smoke:
    name: Released official profile smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve and build the default released profile
        shell: bash
        env:
          GOWORK: off
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ingot"
          ingot_home="$RUNNER_TEMP/ingot-home"
          project="$RUNNER_TEMP/ingot-project"

          go build -trimpath -o "$binary" ./cmd/ingot
          "$binary" --home "$ingot_home" init --profile default
          "$binary" --home "$ingot_home" project init "$project" --profile default
          "$binary" --home "$ingot_home" resolve \
            --use "$project/plugins.toml" \
            --lock "$project/plugins.lock"
          "$binary" --home "$ingot_home" build \
            --use "$project/plugins.toml" \
            --lock "$project/plugins.lock" \
            --tag local/ingot:m3-released-profile-smoke
